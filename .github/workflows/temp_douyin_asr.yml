name: temp-douyin-asr
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check with Qwen3 and Nemotron ASR
        shell: bash
        run: |
          set -euxo pipefail
          AUDIO='https://sf11-cdn-tos.douyinstatic.com/obj/ies-music/7682230534990482217.mp3'
          curl -L --fail --retry 2 -A 'Mozilla/5.0' -e 'https://www.douyin.com/' "$AUDIO" -o douyin.mp3
          ls -lh douyin.mp3
          for engine in qwen3 nemotron; do
            for lang in auto zh; do
              echo "===== $engine / $lang ====="
              if [ "$lang" = auto ]; then
                curl -sS --max-time 180 -X POST 'https://notetakers.vipresearch.ca/stt/v1/transcribe' \
                  -F 'file=@douyin.mp3' -F "engine=$engine" | tee "${engine}_${lang}.json"
              else
                curl -sS --max-time 180 -X POST 'https://notetakers.vipresearch.ca/stt/v1/transcribe' \
                  -F 'file=@douyin.mp3' -F "engine=$engine" -F 'language=zh' | tee "${engine}_${lang}.json"
              fi
              echo
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temp-douyin-crosscheck
          path: |
            qwen3_*.json
            nemotron_*.json
          if-no-files-found: warn
